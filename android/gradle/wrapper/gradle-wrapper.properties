distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 使用官方源 services.gradle.org。
# 早前用腾讯云镜像是因为国内访问官方源会超时，但实测该镜像会返回损坏的
# zip（"zip END header not found"），导致干净环境无法构建——F-Droid 构建机
# 与 GitHub Actions 都在海外，官方源更可靠。
# 国内开发者如遇超时，可改用 GRADLE_DISTRIBUTION_URL 环境变量覆盖，或
# 手动下载后放到 ~/.gradle/wrapper/dists/ 缓存目录。
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip
networkTimeout=60000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

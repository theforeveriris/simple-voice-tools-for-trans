# Summary, description, screenshots and changelogs live in the upstream
# Fastlane layout (fastlane/metadata/android/{en-US,zh-CN,zh-TW,ja-JP}/),
# so they are intentionally not duplicated here.
#
# versionCode is derived in android/app/build.gradle from package.json as
# major*10000 + minor*100 + patch, which cannot be parsed statically from a
# tag. Tag-based auto-update is therefore left off; add a Builds entry by
# hand for each release.
AutoUpdateMode: None
UpdateCheckMode: None

Builds:
  - versionName: 0.11.0
    versionCode: 1100
    commit: 33c47afb9e5c08f6b08c523317363964ab999f62
    subdir: android
    # The F-Droid build server ships only default-jdk-headless, without
    # Node.js/npm. Vite 7 needs Node ^20.19.0; Debian trixie has 20.19.2.
    sudo:
      - apt-get update -y
      - apt-get install -y --no-install-recommends nodejs npm
    # Uses F-Droid's gradlew-fdroid, which picks the Gradle version from the
    # AGP version (AGP 8.7.2 here -> Gradle 8.11.1).
    gradle:
      - yes
    # The APK lands in the app module; F-Droid otherwise only looks in
    # <root>/build/outputs/apk/release.
    output: app/build/outputs/apk/release/*-release-unsigned.apk
    # init runs inside subdir (android/), npm deps live in the repo root.
    # The Gradle build then runs npm run build + npx cap sync android via the
    # preBuild hook in android/app/build.gradle.
    init:
      - cd .. && npm ci --no-audit --no-fund

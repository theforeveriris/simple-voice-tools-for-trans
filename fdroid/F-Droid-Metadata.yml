Description:
  en-US: |
    A voice measurement, analysis and training tracker built on the Web Audio API.

    Speak into your microphone and get complete curves and statistics for pitch
    (F0), formants (F1/F2) and energy level — and see where your voice sits
    within the male and female vocal range bands.

    Features:

    • Pitch, formant and energy tracking with full analysis curves
    • Recording tests that compare your voice against a baseline
    • Long-term history and trend charts for your voice over time
    • Voice-quality metrics (HNR, CPP, shimmer, jitter) and AI-assisted
      parameter suggestions
    • Practice reminders via local notifications
    • Optional app lock (biometric / PIN) and a separate demo library for
      safe demonstrations
    • Local backup and restore, including encrypted archives and a 30-day
      trash for deleted records
    • Works fully offline — all analysis happens on your device
    • Available on Android, desktop and as an installable web app

    Built with React, TypeScript, Vite and Capacitor.

  zh-CN: |
    基于 Web Audio API 的嗓音测量、分析与训练追踪工具。

    对着麦克风说话，即可得到基频（F0）、共振峰（F1/F2）与能量级的完整曲线
    与统计，并可查看你的嗓音处于男声 / 女声音域中的位置。

    主要功能：

    • 基频、共振峰与能量追踪，输出完整分析曲线
    • 录音测试，与基线对比
    • 长期历史记录与趋势图表
    • 嗓音质量指标（HNR、CPP、shimmer、jitter）与 AI 辅助的参数建议
    • 本地通知的练习提醒
    • 可选的应用锁（生物识别 / PIN）与独立演示资料库，便于安全演示
    • 本地备份与恢复，支持加密压缩包与 30 天记录回收站
    • 完全离线运行——所有分析都在你的设备上完成
    • 同时提供 Android、桌面端与可安装的网页版

    使用 React、TypeScript、Vite 与 Capacitor 构建。

  zh-TW: |
    以 Web Audio API 打造的嗓音測量、分析與訓練追蹤工具。

    對著麥克風說話，即可取得基頻（F0）、共振峰（F1/F2）與能量級的完整曲線
    與統計，並可查看你的嗓音位於男聲 / 女聲音域中的位置。

    主要功能：

    • 基頻、共振峰與能量追蹤，輸出完整分析曲線
    • 錄音測試，與基準線比較
    • 長期歷史紀錄與趨勢圖表
    • 嗓音品質指標（HNR、CPP、shimmer、jitter）與 AI 輔助的參數建議
    • 本機通知的練習提醒
    • 可選的應用程式鎖（生物辨識 / PIN）與獨立示範資料庫，便於安全示範
    • 本機備份與還原，支援加密壓縮檔與 30 天紀錄回收站
    • 完全離線執行——所有分析都在你的裝置上完成
    • 同時提供 Android、桌面版與可安裝的網頁版

    使用 React、TypeScript、Vite 與 Capacitor 建構。

  ja: |
    Web Audio API をベースにした声の測定・分析・トレーニングアプリです。

    マイクに向かって話すだけで、ピッチ（F0）、フォルマント（F1/F2）、エネルギー
    レベルの完全な曲線と統計が得られ、自分の声が男性域・女性域のどこに位置するか
    も確認できます。

    主な機能：

    • ピッチ・フォルマント・エネルギーのトラッキングと完全な分析曲線
    • 録音テストによるベースラインとの比較
    • 長期の履歴とトレンドグラフ
    • 声質指標（HNR、CPP、shimmer、jitter）と AI によるパラメータ提案
    • ローカル通知による練習リマインダー
    • 任意のアプリロック（生体認証 / PIN）と、演示用の独立したライブラリ
    • ローカルバックアップと復元。暗号化アーカイブと 30 日間のゴミ箱に対応
    • 完全オフラインで動作——解析はすべて端末上で実行
    • Android・デスクトップ・インストール可能な Web アプリに対応

    React、TypeScript、Vite、Capacitor で構築されています。


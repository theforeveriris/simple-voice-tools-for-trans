Builds:
  - versionName: 0.11.0
    versionCode: 1100
    commit: 54139b0
    subdir: android
    # F-Droid 的构建机没有 Node.js/npm，用 sudo 安装。
    # nodejs 版本需满足 Vite 7 的要求（Node >= 20.19 或 >= 22.12）。
    sudo:
      - apt-get update -y
      - apt-get install -y --no-install-recommends nodejs npm
    # 用 F-Droid 自带的 gradle（gradlew-fdroid），不走项目里的
    # gradle-wrapper.properties —— 那里配的是国内镜像，F-Droid 构建机在海外。
    gradle:
      - yes
    # APK 落在 app 这个 module 的子目录里，F-Droid 默认只找
    # <root>/build/outputs/apk/release，因此必须显式指定。
    output: app/build/outputs/apk/release/*-release-unsigned.apk
    # 前端依赖与构建产物不入库，需在 Gradle 构建前准备。
    # init 命令的工作目录是 subdir（android/），但 npm 依赖装在仓库根，
    # 所以要先 cd 到上一级。
    # Gradle 侧的 preBuild 钩子会自动跑 npm run build + npx cap sync android，
    # 这里只需保证 node_modules 存在（settings.gradle 也会兜底跑 npm ci）。
    init:
      - cd .. && npm ci --no-audit --no-fund
    gradleProps:
      - org.gradle.jvmargs=-Xmx3g
    timeout: 60
